<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Inbox</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
</head>

<body>
    <main class="auth-page">
        <form id="auth-form" class="auth-card fade-in" novalidate>
            <h1 class="auth-card__title">Sign in</h1>

            <div id="auth-error" class="auth-error" role="alert" hidden></div>

            <div class="float-field">
                <input type="email" id="email" name="email" class="input float-field__input" placeholder=" " autocomplete="username" required />
                <label for="email" class="float-field__label">Email</label>
            </div>

            <div class="float-field">
                <input type="password" id="password" name="password" class="input float-field__input float-field__input--toggle" placeholder=" " autocomplete="current-password" required />
                <label for="password" class="float-field__label">Password</label>
                <button type="button" id="toggle-password" class="btn btn--icon float-field__toggle" aria-label="Show password" aria-pressed="false">
                    <img id="icon-eye" class="icon" aria-hidden="true" src="assets/img/icons/eye.svg" alt="" />
                    <img id="icon-eye-off" class="icon" aria-hidden="true" hidden src="assets/img/icons/eye-off.svg" alt="" />
                </button>
            </div>

            <button type="submit" id="submit-btn" class="btn auth-card__submit">
                <span id="submit-label">Sign in</span>
            </button>
        </form>
    </main>

    <script type="module" src="assets/js/auth.js"></script>
</body>

</html>
