<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Inbox</title>
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem("theme"); } catch (e) {}
            var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme = stored || (prefersDark ? "dark" : "light");
        })();
    </script>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
</head>

<body>
    <button id="theme-toggle-btn" class="btn btn--icon theme-toggle" aria-label="Switch to dark theme">
        <svg class="icon" aria-hidden="true">
            <use id="theme-toggle-icon" href="assets/img/icons/icons.svg#icon-moon"></use>
        </svg>
    </button>

    <main class="auth-page">
        <form id="auth-form" class="auth-card fade-in" novalidate>
            <h1 class="auth-card__title">Sign in</h1>

            <div id="auth-error" class="auth-error" role="alert" hidden></div>

            <label class="field">
                <span class="field__label">Email</span>
                <input type="email" id="email" name="email" class="input" autocomplete="username" required />
            </label>

            <label class="field">
                <span class="field__label">Password</span>
                <div class="password-field">
                    <input type="password" id="password" name="password" class="input" autocomplete="current-password" required />
                    <button type="button" id="toggle-password" class="btn btn--icon password-field__toggle" aria-label="Show password" aria-pressed="false">
                        <svg class="icon" aria-hidden="true">
                            <use id="toggle-password-icon" href="assets/img/icons/icons.svg#icon-eye"></use>
                        </svg>
                    </button>
                </div>
            </label>

            <button type="submit" id="submit-btn" class="btn auth-card__submit">
                <span id="submit-label">Sign in</span>
            </button>
        </form>
    </main>

    <script type="module" src="assets/js/modules/theme.js"></script>
    <script type="module" src="assets/js/auth.js"></script>
</body>

</html>
