<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/profile.css" />
</head>

<body>
    <main class="profile-page">
        <a href="home.html" class="back-link">
            <img class="icon icon--sm" aria-hidden="true" src="assets/img/icons/chevron-left.svg" alt="" />
            Inbox
        </a>

        <section class="profile-card fade-in">
            <div class="profile-card__header">
                <h1 class="profile-card__title">Profile</h1>
                <div class="profile-actions">
                    <button id="edit-btn" class="btn btn--icon" aria-label="Edit profile">
                        <img class="icon" aria-hidden="true" src="assets/img/icons/edit.svg" alt="" />
                    </button>
                    <div id="edit-actions" class="edit-actions" hidden>
                        <button id="cancel-btn" class="btn btn--icon" aria-label="Cancel">
                            <img class="icon" aria-hidden="true" src="assets/img/icons/cancel.svg" alt="" />
                        </button>
                        <button id="save-btn" class="btn btn--icon" aria-label="Save">
                            <img class="icon" aria-hidden="true" src="assets/img/icons/save.svg" alt="" />
                        </button>
                    </div>
                </div>
            </div>

            <div id="profile-error" class="profile-error" role="alert" hidden></div>

            <form id="profile-form" class="profile-fields">
                <div class="profile-field">
                    <span class="profile-field__label">Name</span>
                    <div class="profile-field__stack">
                        <span id="name-value" class="profile-field__value"></span>
                        <input id="name-input" class="profile-field__input input" type="text" autocomplete="off" />
                    </div>
                </div>

                <div class="profile-field">
                    <span class="profile-field__label">API key</span>
                    <div class="profile-field__stack">
                        <span id="api-value" class="profile-field__value"></span>
                        <input id="api-input" class="profile-field__input input" type="text" autocomplete="off" />
                    </div>
                </div>

                <div class="profile-field">
                    <span class="profile-field__label">Namespace</span>
                    <div class="profile-field__stack">
                        <span id="namespace-value" class="profile-field__value"></span>
                        <input id="namespace-input" class="profile-field__input input" type="text" autocomplete="off" />
                    </div>
                </div>
            </form>
        </section>

        <section class="profile-card fade-in">
            <h2 class="profile-card__subtitle">Overview</h2>

            <div class="overview-stat">
                <span class="overview-stat__label">Sequel tags generated</span>
                <span id="sequel-count" class="overview-stat__value">0</span>
            </div>

            <div class="custom-tags">
                <span class="profile-field__label">Custom tags</span>
                <ul id="custom-tags-list" class="custom-tags__list"></ul>
                <p id="custom-tags-empty" class="custom-tags__empty">No custom tags yet.</p>
            </div>
        </section>

        <button id="sign-out-btn" class="btn btn--ghost sign-out-btn">
            <img class="icon icon--sm" aria-hidden="true" src="assets/img/icons/sign-out.svg" alt="" />
            Sign out
        </button>
    </main>

    <script type="module" src="assets/js/profile.js"></script>
</body>

</html>
